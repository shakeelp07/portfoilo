<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0e14" />
    <title>404 — Page Not Found | Pathan Shakeel Khan</title>
    <link rel="icon" href="/images/favicon-32.png" type="image/png" sizes="32x32" />
    <style>
      :root {
        --bg: #0a0e14;
        --surface: #111822;
        --border: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --cyan: #00e5ff;
        --cyan-hover: #38bdf8;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: "Times New Roman", Times, Georgia, serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        line-height: 1.6;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 2.5rem 2rem;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }
      .code {
        font-size: 5rem;
        font-weight: 700;
        color: var(--cyan);
        line-height: 1;
        letter-spacing: -2px;
        margin-bottom: 0.5rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 1rem;
        color: #f8fafc;
      }
      p {
        color: var(--muted);
        font-size: 1rem;
        margin-bottom: 2rem;
      }
      .btn {
        display: inline-block;
        background: var(--cyan);
        color: #000000;
        text-decoration: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 0.75rem 1.5rem;
        border-radius: 4px;
        transition: background-color 0.2s ease, transform 0.2s ease;
      }
      .btn:hover {
        background: var(--cyan-hover);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>The file or route you requested does not exist or has been restricted.</p>
      <a href="/" class="btn">Return to Portfolio</a>
    </main>
  </body>
</html>
